name = "bond"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# الموقع (ملفات ثابتة) + المسارات التي يعالجها الـ Worker أولاً
[assets]
directory = "www"
binding = "ASSETS"
run_worker_first = ["/api/*", "/fetch_chapter", "/tg_file/*"]

# قاعدة البيانات D1 (تم وضع المعرّف الخاص بك هنا)
[[d1_databases]]
binding = "DB"
database_name = "manhwa-db"
database_id = "9f55e552-b0b7-4c21-a90c-6b7928d0cdc7"

# ضغط الصور وتحويلها إلى WebP
[images]
binding = "IMAGES"

# يعمل كل 30 دقيقة
[triggers]
crons = ["*/30 * * * *"]
