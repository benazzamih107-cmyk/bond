    let s=null;

      try{const r=await CHP.get({url:u,headers:{'User-Agent':ua,Referer:ref,Accept:'image/avif,image/webp,image/*,*/*;q=0.8'},responseType:'blob',connectTimeout:12000,readTimeout:25000});

const DLQ=[];let _dlRun=false,_dlCur=null;
// إشعار تقدّم التحميل في شريط الهاتف (يُحدَّث على نفس المعرّف، صامت)
const DLN_ID=7421;let _dlnT=0,_dlnLast='';
const titleOf=s=>(D.data&&D.slug===s&&D.data.title)||(INDEX.get(s)||{}).title||(store.get('dlinfo:'+s,null)||{}).title||s;

// خدمة أمامية أصلية (إضافة capacitor-dlservice المرفقة): تُبقي التحميل شغّالًا عند الخروج من التطبيق وتعرض شريط تقدّم في الإشعارات.
// إن لم تكن الإضافة مبنية داخل الـ APK تُرفض الاستدعاءات بهدوء ويعمل التطبيق كالمعتاد.
const DSV=(()=>{try{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?((C.Plugins&&C.Plugins.DlService)||C.registerPlugin('DlService')):null}catch(e){return null}})();

async function fgStart(title,body){if(!DSV||_fgOn||_fgBad)return;try{await DSV.start({title,body,progress:-1});_fgOn=true}catch(e){_fgBad=true;return}

}

// انتظار لا تخنقه WebView في الخلفية: مؤقّت أصلي عندما تكون الخدمة شغّالة
const sleepMs=ms=>(DSV&&_fgOn)?DSV.sleep({ms}).catch(()=>new Promise(r=>setTimeout(r,ms))):new Promise(r=>setTimeout(r,ms));
async function dlPump(){
  if(_dlRun)return;_dlRun=true;let ok=0,total=0,last=null;
  try{
    await fgStart('تحميل الفصول','جارٍ التحضير…');
    while(DLQ.length){
      const j=DLQ.shift();_dlCur=j;dlSave();fgUpd(titleOf(j.slug),'فصل '+j.ch+(DLQ.length?' · المتبقي '+DLQ.length:''),0);
      await dlRun(j.slug,j.ch);total++;if(dlHas(j.slug,j.ch)){ok++;last=j}

async function dlRun(slug,ch){
  dlState(slug,ch,'r',svg('loader',0,'sp'));dlNotif(slug,ch,0,true);
  try{
    if(!navigator.onLine)throw new Error('لا يوجد اتصال');
    const imgs=await getChapter(slug,ch);if(!imgs.length)throw new Error('لا توجد صور');
    const tot=imgs.length,out=new Array(tot).fill(null);let done=0;
    const one=async i=>{for(let a=0;a<3;a++){try{return await shrink(await imgData(imgs[i]))}catch(e){await new Promise(r=>setTimeout(r,400*(a+1)))}}return null};
    const pass=async(idx,cc)=>{let cur=0;await Promise.all(Array.from({length:Math.min(cc,idx.length)},async()=>{while(cur<idx.length){const i=idx[cur++],b=await one(i);if(b){out[i]=b;done++;{const pc=Math.round(done/tot*100);dlState(slug,ch,'r',pc+'%');dlNotif(slug,ch,pc)}}}}))};
    // أول دفعة 5 صور، ثم توقف 1–1.2 ثانية، ثم صورتان بصورتان بنفس الفاصل حتى ينتهي الفصل
    const gap=()=>sleepMs(1000+Math.random()*200);
    for(let pos=0,first=true;pos<tot;first=false){const n=first?5:2;await pass(out.map((_,i)=>i).slice(pos,pos+n),n);pos+=n;if(pos<tot)await gap()}
    let miss=out.map((b,i)=>b?-1:i).filter(i=>i>=0);
    for(let r=0;r<2&&miss.length;r++){toast('إعادة تحميل '+miss.length+' صفحة ناقصة…');await gap();await pass(miss,2);miss=out.map((b,i)=>b?-1:i).filter(i=>i>=0)}
    if(miss.length===tot)throw new Error('فشل — تحقق من الاتصال');
    if(miss.length&&!confirm('تعذر تحميل '+miss.length+' صفحة من '+tot+'. حفظ الفصل ناقصاً؟'))throw new Error('لم يكتمل التحميل');
    if(!await dlSet(slug,ch,out.filter(Boolean)))throw new Error('فشل التخزين — قد تكون المساحة ممتلئة');
    localStorage.setItem(dlc(slug,ch),'1');
    const pi=store.get('dlinfo:'+slug,null)||{},cur=D.data&&D.slug===slug;
    store.set('dlinfo:'+slug,{slug,title:cur?D.data.title:(pi.title||slug),cover:cur?D.data.cover:(pi.cover||'')});
    saveCover(slug);toast('✅ تم تحميل الفصل '+ch+' ('+out.filter(Boolean).length+' صورة)');
  }catch(e){toast('❌ '+emsg(e))}
  dlState(slug,ch,null);
}

const NEWMS=30*864e5;

function recordSeen(items){

async function azCrawl(){
  if(!navigator.onLine)return;
  let st=store.get('azcrawl',{p:1,done:false,t:0});
  if(st.done&&Date.now()-st.t<14*864e5)return;
  if(st.done)st={p:1,done:false,t:0};
  let prev=new Set(),batch=0;
  // قليل ولطيف: 3 صفحات فقط في كل جولة، ثم استراحة 4–8 ساعات، والتقدّم محفوظ
  for(let p=st.p;p<=300;p++){
    if(batch++>=3){setTimeout(azCrawl,(4+Math.random()*4)*36e5);break}
    while(document.hidden||S.view==='reader'||H.loading||badgeBusy||_dlRun)await new Promise(r=>setTimeout(r,5000));
    let items;try{items=await azList('library',p)}catch(e){if(e.status===404){st.done=true;st.t=Date.now()}break}
    if(!items.length||items.every(i=>prev.has(i.slug))){st.done=true;st.t=Date.now();break}
    prev=new Set(items.map(i=>i.slug));
    items.forEach(i=>INDEX.set(i.slug,i));saveIndex();
    st.p=p+1;store.set('azcrawl',st);
    await new Promise(r=>setTimeout(r,20000+Math.random()*20000));
  }
  store.set('azcrawl',st);
}

// يجمع كوكيز الرد (Set-Cookie) في جرّة بسيطة
function prCk(hd,jar){
  for(const k of Object.keys(hd||{})){
    if(k.toLowerCase()!=='set-cookie')continue;
    const v=hd[k],arr=Array.isArray(v)?v:String(v).split(/,\s*(?=[A-Za-z0-9_.\-]+=)/);
    for(const s of arr){const nv=String(s).split(';')[0],i=nv.indexOf('=');if(i>0)jar[nv.slice(0,i).trim()]=nv.slice(i+1).trim()}

// اختبار كامل لسلسلة التشغيل في witanime: صفحة الحلقة ← قائمة السيرفرات (POST) ← تفعيل السيرفر (POST) ← بوابة التشغيل (GET)
async function prWit(){
  const url=prUrl();if(!url)return;
  if(!CHP)return prShow('هذه السلسلة تعمل داخل التطبيق فقط (CapacitorHttp غير متاح)');
  let base;try{base=new URL(url).origin}catch(e){return prShow('رابط غير صالح')}
  const out=[],jar={};let full='';
  const log=t=>{out.push(t);prShow(out.join('\n'))};
  const req=async(method,u,extra,label)=>{
    const h={'User-Agent':UA,'Accept-Language':'ar,en-US;q=0.8,en;q=0.6',Referer:url,...extra};
    if(h.Referer===null)delete h.Referer;
    if(Object.keys(jar).length)h.Cookie=Object.entries(jar).map(([k,v])=>k+'='+v).join('; ');
    const o={url:u,headers:h,responseType:'text',connectTimeout:25000,readTimeout:25000},t0=Date.now();
    let r=method==='POST'?await CHP.post(o):await CHP.get(o);
    if(method==='POST'&&r.status===411)r=await CHP.post({...o,headers:{...h,'Content-Type':'application/json'},data:'{}'});
    prCk(r.headers,jar);
    const d=typeof r.data==='string'?r.data:JSON.stringify(r.data),hd=r.headers||{};
    log('\n== '+label+' ==\n'+method+' '+u.replace(base,'')+(r.url&&r.url!==u?'\n→ '+r.url:'')+'\nHTTP '+r.status+' | '+(Date.now()-t0)+'ms | len='+d.length+' | '+(hd['Content-Type']||hd['content-type']||'-')+' | cookies: '+Object.keys(jar).join(','));
    return{st:r.status,d};
  };
  try{
    const pg=await req('GET',url,{Accept:'text/html,application/xhtml+xml,*/*;q=0.8',Referer:null},'1) صفحة الحلقة');
    const csrf=(/<meta name="csrf-token" content="([^"]+)"/.exec(pg.d)||[])[1]||'';
    let su=(/sourcesUrl:\s*'([^']+)'/.exec(pg.d)||[])[1];
    su=su?su.replace(/\\\//g,'/'):new URL(url).pathname.replace(/\/$/,'')+'/sources';
    log('csrf='+(csrf?csrf.slice(0,8)+'…':'غير موجود')+' | sourcesUrl='+su);
    if(!csrf)return log('\nلا يوجد csrf — ربما الصفحة محجوبة. جرّب زر «متصفح مخفي» على نفس الرابط.');
    const ajax={Accept:'application/json','X-CSRF-TOKEN':csrf,'X-Requested-With':'XMLHttpRequest',Origin:base};
    const sr=await req('POST',base+su,ajax,'2) قائمة السيرفرات');
    let j=null;try{j=JSON.parse(sr.d)}catch(e){}
    if(!j)return log('\nالرد ليس JSON:\n'+sr.d.slice(0,800));
    const ps=j.players||{},toks=[];
    log('\nplayers:');
    for(const [q,arr] of Object.entries(ps))for(const p of(Array.isArray(arr)?arr:[])){
      toks.push({q,p});log('  '+q+' | '+(p.label||'-')+' | '+(p.version||'sub')+' | '+(p.lang||'jp')+' | '+String(p.token||'').slice(0,8)+'… | مفاتيح: '+Object.keys(p).join(','));
    }
    const dl=Object.values(j.downloads||{}).flat();
    log('downloads: '+dl.length+(dl[0]?' | مثال: '+JSON.stringify({...dl[0],token:String(dl[0].token||'').slice(0,8)+'…'}):''));
    log('مفاتيح الرد: '+Object.keys(j).join(','));
    if(!toks.length)return log('\nلا توجد سيرفرات. الرد الخام:\n'+sr.d.slice(0,1200));
    let n=0;
    for(const {q,p} of toks){
      if(n++>=3)break;
      if(!/^[a-f0-9]{64}$/.test(p.token||''))continue;
      const ss=await req('POST',base+'/watch/stream-source/'+p.token,ajax,'3) تفعيل سيرفر '+q+' / '+(p.label||'-'));
      log('الرد: '+ss.d.slice(0,400));
      const gt=await req('GET',base+'/watch/stream-gate/'+p.token,{Accept:'text/html,application/xhtml+xml,*/*;q=0.8',Referer:null,'Sec-Fetch-Dest':'iframe'},'4) بوابة التشغيل '+q+' / '+(p.label||'-'));
      full=gt.d;
      log(gt.d.length<6000?'\n--- محتوى البوابة ---\n'+gt.d:'\n'+prAnalyze(gt.d,base,''));
    }
    log('\nانتهى — اضغط «نسخ الكل» وأرسل النتيجة');
    prShow(out.join('\n'),full.length>=6000?full:'');
  }catch(e){log('\nFAIL: '+String((e&&e.message)||e))}
}

async function accountSubmit(btn){

async function pickAvatar(file){
  if(!file||!loggedIn())return;
  setErr('جاري رفع الصورة…',true);
  try{
    const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>rej(new Error('تعذر قراءة الصورة'));setTimeout(()=>rej(new Error('انتهت مهلة قراءة الصورة، جرّب صورة أخرى')),15000);i.src=u});
    const S2=128,c=document.createElement('canvas');c.width=c.height=S2;
    const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,S2,S2);
    let data=c.toDataURL('image/jpeg',.8);if(data.length>55000)data=c.toDataURL('image/jpeg',.5);
    if(!data.startsWith('data:image/jpeg'))throw new Error('تعذر تجهيز الصورة');
    setErr('جاري رفع الصورة… ('+Math.round(data.length/1024)+' ك.ب)',true);
    const v=await sbRpc('set_avatar',{p_data:data});
    avPut(SBS.user.id,v,data);
    AC.err='';AC.ok=false;
    ME.profile=Object.assign({username:'',avatar_v:0},ME.profile,{avatar_v:v});
    renderAccount();updDrawer();toast('✅ تم تحديث الصورة');
  }catch(e){setErr(e.message)}
}

async function loadComments(reset){
  const box=$('#clist'),work=CM.work;
  if(reset){CM.off=0;CM.list=[];box.innerHTML='<div class="msg">جاري التحميل…</div>'}
  try{
    const rows=await sbRpc('get_comments',{p_work:work,p_limit:20,p_offset:CM.off});
    if(work!==CM.work)return;
    const tops=rows.filter(r=>!r.parent_id).length,seen=new Set(CM.list.map(r=>r.id));
    rows.forEach(r=>{if(!seen.has(r.id))CM.list.push(r)});
    CM.more=tops>=20;CM.off+=tops;renderComments();loadAvatars(rows);
  }catch(e){box.innerHTML='<div class="msg rt">❌ '+esc(e.message)+'<br><br><button id="cRetry">إعادة المحاولة</button></div>'}

function cmHtml(c,rp,nrep,open){
  const mine=loggedIn()&&c.user_id===SBS.user.id,li=loggedIn();
  return '<div class="cm'+(rp?' rp':'')+'" data-id="'+c.id+'" data-uid="'+esc(c.user_id)+'">'+avHtml(c.user_id,c.username,c.avatar_v)+'<div class="cb">'+nameHtml(c.username,c.is_admin)+'<small>'+esc(ago(c.created_at))+'</small><div class="ct">'+esc(c.body)+'</div><div class="ca">'
    +'<button class="lk'+(c.liked?' on':'')+'" data-a="like">'+svg('heart',c.liked)+' <span>'+(+c.like_count||0)+'</span></button>'
    +(li?'<button data-a="reply">'+svg('msg')+' رد</button>':'')
    +(li&&!mine&&!c.is_admin?'<button data-a="report">'+svg('flag')+' إبلاغ</button>':'')

function renderComments(){
  const box=$('#clist'),by=(a,b)=>new Date(a.created_at)-new Date(b.created_at);
  const tops=CM.list.filter(r=>!r.parent_id).sort((a,b)=>by(b,a)),rep={};
  CM.list.filter(r=>r.parent_id).sort(by).forEach(r=>(rep[r.parent_id]=rep[r.parent_id]||[]).push(r));
  if(!tops.length){box.innerHTML='<div class="msg">لا توجد تعليقات بعد. كن أول من يعلّق!</div>';return}
  box.innerHTML=tops.map(c=>{const rs=rep[c.id]||[],op=CM.open.has(c.id);return '<div class="th">'+cmHtml(c,false,rs.length,op)+(rs.length&&op?'<div class="rps">'+rs.map(r=>cmHtml(r,true)).join('')+'</div>':'')+'</div>'}).join('')+(CM.more?'<button id="cMore" style="width:100%;margin-top:10px">عرض المزيد</button>':'');

async function sendComment(){
  const ta=$('#cText'),body=ta?ta.value.trim():'';if(!body||CM.busy)return;
  CM.busy=true;$('#cSend').disabled=true;
  try{
    const r=await sbRpc('post_comment',{p_work:CM.work,p_body:body,p_parent:CM.reply?CM.reply.id:null,p_chapter:null,p_slug:D.slug||null,p_title:(D.data&&D.data.title)||null});
    if(r.ok){ta.value='';CM.reply=null;renderComposer();await loadComments(true);updCount()}
    else if(r.error==='profanity'){await loadMe();renderComposer();alert('تم رفض تعليقك لاحتوائه على ألفاظ نابية، وتم منعك من التعليق لمدة 3 أشهر.')}
    else if(r.error==='banned'){await loadMe();renderComposer();toast('🚫 ممنوع من التعليق حتى '+new Date(r.until).toLocaleDateString('ar'))}

// يُحظر الجهاز بمعرّفاته الحقيقية فقط (ANDROID_ID + معرّف Widevine DRM) — لا يُنشأ أي معرّف وهمي/عشوائي.
// ANDROID_ID يتغيّر مع تغيير مفتاح التوقيع، أما Widevine فيبقى ثابتًا بعد الحذف/إعادة التثبيت/تغيير التوقيع ولا يتغيّر إلا بفرمتة الجهاز.
let _devIds=null;
async function nativeDevIds(){
  const C=window.Capacitor,isN=!!(C&&C.isNativePlatform&&C.isNativePlatform());
  if(!isN)return[];
  for(let i=0;i<6;i++){
    const ids=[];
    try{
      let P=C.Plugins&&C.Plugins.DlService;
      if(!P&&C.registerPlugin){try{P=C.registerPlugin('DlService')}catch(e){}}
      if(P&&P.deviceIds){
        const r=await P.deviceIds();
        if(r&&r.android&&String(r.android).length>=8)ids.push('a-'+r.android);
        if(r&&r.drm&&String(r.drm).length>=16)ids.push('m-'+r.drm);
      }
    }catch(e){}
    if(!ids.some(x=>x[0]==='a')){
      try{
        let P=C.Plugins&&C.Plugins.Device;
        if(!(P&&P.getId)&&C.registerPlugin){try{P=C.registerPlugin('Device')}catch(e){}}
        if(P&&P.getId){const r=await P.getId();const v=r&&(r.identifier||r.uuid);if(v)ids.push('a-'+v)}
      }catch(e){}
    }
    if(ids.length)return ids;
    await new Promise(r=>setTimeout(r,600));
  }
  return[];
}
// المعرّفات الحقيقية + المعرّف القديم المحفوظ سابقًا (للتوافق مع الحظر القديم فقط، ولا يُنشأ بعد الآن)
async function devIds(){
  if(_devIds)return _devIds;
  const out=await nativeDevIds();
  let old=null;try{old=localStorage.getItem('devid')}catch(e){}
  if(old&&!out.includes(old))out.push(old);
  const ids=out.map(x=>String(x).slice(0,80));
  if(out.some(x=>x[0]==='a'||x[0]==='m'))_devIds=ids; // لا نثبّت النتيجة إذا فشلت المعرّفات الأصلية مؤقتًا
  return ids;
}

    }
  }
}

// ----- مزامنة المفضلة وسجل القراءة -----
let syncT=null;
function syncSoon(){if(!loggedIn())return;clearTimeout(syncT);syncT=setTimeout(()=>{syncT=null;syncPush().catch(()=>{})},2500)}
function localState(){
  const nw={},rd={};let nr=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('fs2:')){try{const t=JSON.parse(localStorage.getItem(k));if(t>0&&Date.now()-t<=NEWMS)nw[k.slice(4)]=t}catch(e){}}
    else if(k.startsWith('read:')&&nr<150){try{const a=JSON.parse(localStorage.getItem(k));if(Array.isArray(a)&&a.length){rd[k.slice(5)]=a.slice(-400);nr++}}catch(e){}}
  }
  const ks=Object.keys(nw);if(ks.length>400)ks.sort((a,b)=>nw[b]-nw[a]).slice(400).forEach(k=>delete nw[k]);
  return{nw,rd};
}
function mergeState(sv){
  if(!sv||typeof sv!=='object')return;
  const rd=sv.rd||{},nw=sv.nw||{};
  Object.keys(rd).forEach(s=>{const cur=store.get('read:'+s,[]),u=[...new Set([...cur,...(rd[s]||[])])];if(u.length!==cur.length)store.set('read:'+s,u)});
  Object.keys(nw).forEach(k=>{const cur=store.get('fs2:'+k,null);if(cur===null||cur===0||nw[k]>cur)store.set('fs2:'+k,nw[k])});
}
async function syncPush(){
  if(!loggedIn()||!navigator.onLine)return;
  const uid=SBS.user.id;
  await sbFetch('/rest/v1/user_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{user_id:uid,favs:store.get('favs',[]),history:store.get('history',[]),later:store.get('later',[]),state:localState(),updated_at:new Date().toISOString()}});
  store.set('sy_ts:'+uid,Date.now());
}
const uniqSlug=(...ls)=>{const s=new Set(),o=[];for(const l of ls)for(const x of(l||[]))if(x&&x.slug&&!s.has(x.slug)){s.add(x.slug);o.push(x)}return o};
function refreshNew(){document.querySelectorAll('a.card').forEach(a=>{const sl=decodeURIComponent((a.getAttribute('href')||'').slice(4));a.querySelectorAll('.nw').forEach(x=>{if(!isNew(sl,(a.querySelector('.bd')||{}).textContent))x.remove()})})}
function refreshLists(){if(S.mode==='later')$('#mL').click();else if(S.mode==='favs')$('#mF').click();else if(S.mode==='history')$('#mY').click();if(S.view==='detail'&&D.data)updateFav()}
async function syncPull(){
  if(!loggedIn()||!navigator.onLine||syncT)return;
  const uid=SBS.user.id,rows=await sbFetch('/rest/v1/user_data?user_id=eq.'+uid+'&select=favs,history,later,state,updated_at'),sv=rows&&rows[0];
  if(sv&&sv.state){mergeState(sv.state);refreshNew()}
  if(!sv){store.set('sy_merged:'+uid,true);await syncPush();return}
  if(!store.get('sy_merged:'+uid,false)){
    store.set('favs',uniqSlug(store.get('favs',[]),sv.favs));store.set('later',uniqSlug(store.get('later',[]),sv.later));
    store.set('history',uniqSlug(store.get('history',[]),sv.history).slice(0,50));
    store.set('sy_merged:'+uid,true);await syncPush();refreshLists();return;
  }
  if(new Date(sv.updated_at).getTime()>store.get('sy_ts:'+uid,0)){
    store.set('favs',sv.favs||[]);store.set('later',sv.later||[]);store.set('history',sv.history||[]);store.set('sy_ts:'+uid,Date.now());refreshLists();
  }
}
let lastPull=0;
function syncFlush(){if(syncT){clearTimeout(syncT);syncT=null;syncPush().catch(()=>{})}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)syncFlush();
  else if(loggedIn()&&Date.now()-lastPull>45000){lastPull=Date.now();syncPull().catch(()=>{})}
});
addEventListener('online',()=>{if(loggedIn())syncPull().then(syncPush).catch(()=>{})});
function sbInit(){
  if(navigator.onLine&&Date.now()-store.get('purge_ts',0)>12*36e5){store.set('purge_ts',Date.now());sbRpc('purge_expired_accounts').catch(()=>{})}

  if(loggedIn())onLogin().then(()=>{if(ME.status&&ME.status.delete_at)toast('⚠️ حسابك مجدول للحذف — افتح «الحساب» لإلغاء الحذف')}).catch(()=>{});
}

// ===== مركز الإشعارات (جرس) =====
const NT={srv:[],unreadSrv:0,openFor:null};
const chapNotifs=()=>store.get('nchap',[]);
function addChapNotifs(items){
  const l=chapNotifs(),have=new Set(l.map(x=>x.id));let n=0;
  items.forEach(it=>{const id='c:'+it.slug+':'+it.chapter;if(have.has(id))return;n++;l.unshift({id,kind:'chapter',slug:it.slug,title:it.title,chapter:it.chapter,t:Date.now(),read:false})});
  if(!n)return;store.set('nchap',l.slice(0,60));updBadge();
  items.slice(0,5).forEach(it=>osNotify('🔔 فصل جديد!',it.title+' — فصل '+it.chapter,'ch-'+it.slug,{ch:'chapters',slug:it.slug}));
  if(!$('#nsheet').hidden)renderNotifs();
}
function updBadge(){
  const n=(loggedIn()?NT.unreadSrv:0)+chapNotifs().filter(x=>!x.read).length,b=$('#bdg');
  b.hidden=!n;b.textContent=n>9?'9+':n;
}
async function pullNotifs(){
  if(!loggedIn()||!navigator.onLine){NT.srv=[];NT.unreadSrv=0;updBadge();return}
  try{const[l,c]=await Promise.all([sbRpc('get_notifications',{p_limit:40}),sbRpc('unread_notifications')]);NT.srv=l||[];NT.unreadSrv=+c||0;const need=NT.srv.filter(x=>x.kind==='broadcast'&&x.actor_id&&x.actor_av>0&&!avSrc(x.actor_id,x.actor_av)).map(x=>({user_id:x.actor_id,avatar_v:x.actor_av}));if(need.length)await loadAvatars(need)}catch(e){}
  updBadge();if(!$('#nsheet').hidden)renderNotifs();
}
function renderNotifs(){
  const all=[...NT.srv.map(x=>({...x,src:'s',t:new Date(x.created_at).getTime(),read:x.is_read})),...chapNotifs().map(x=>({...x,src:'l'}))].sort((a,b)=>b.t-a.t);
  const box=$('#nlist');
  if(!all.length){box.innerHTML='<div class="msg">لا توجد إشعارات بعد 🔔<br><small>ستصلك هنا الردود والإعجابات على تعليقاتك، والفصول الجديدة لأعمالك المفضلة.</small></div>';return}
  box.innerHTML=all.map(n=>{
    const ic=n.kind==='like'||n.kind==='profile_like'?['heart','#ff5c7a']:n.kind==='reply'?['msg','#6c7cff']:n.kind==='broadcast'?['mega','#f59e0b']:['book','#22c55e'];
    const bc=n.kind==='broadcast',txt=bc?'<span class="bch" data-u="'+esc(n.actor_id||'')+'">'+(n.actor_id?avHtml(n.actor_id,n.actor,n.actor_av):'')+nameHtml(n.actor||'المشرف',true)+'</span> <small class="bcl">أرسل رسالة للجميع</small>':n.kind==='profile_like'?'<b>'+esc(n.actor||'مستخدم')+'</b> أعجب بملفك الشخصي':n.kind==='like'?'<b>'+esc(n.actor||'مستخدم')+'</b> أعجب بتعليقك':n.kind==='reply'?'<b>'+esc(n.actor||'مستخدم')+'</b> ردّ على تعليقك':'فصل جديد: <b>'+esc(n.title||'')+'</b> — فصل '+esc(n.chapter)
    const sub=n.kind==='chapter'?'':n.kind==='broadcast'?esc(n.snippet||''):n.kind==='profile_like'?'':esc(n.title||'')+(n.snippet?' · «'+esc(n.snippet)+'»':'');
    return '<div class="nt'+(n.read?'':' un')+(n.kind==='broadcast'?' open':'')+'" data-s="'+n.src+'" data-id="'+esc(n.id)+'" style="--c:'+ic[1]+'"><span class="ni">'+(bc?'<span class="bang">!</span>':svg(ic[0]))+'</span><div class="nb">'+txt+(sub?'<small>'+sub+'</small>':'')+'<small>'+esc(ago(n.t))+'</small></div>'+(n.kind==='broadcast'?'':'<button class="nx" data-x="1">×</button>')+'</div>'}).join('');
}
async function openNotifs(){
  $('#nsheet').hidden=false;renderNotifs();
  if(loggedIn()){await pullNotifs();if(NT.unreadSrv){sbRpc('mark_notifications_read').catch(()=>{});NT.unreadSrv=0}}
  const l=chapNotifs();if(l.some(x=>!x.read)){setTimeout(()=>{store.set('nchap',chapNotifs().map(x=>({...x,read:true})));updBadge()},1500)}
  setTimeout(updBadge,1600);
}
$('#bell').onclick=openNotifs;
$('#nclose').onclick=()=>{$('#nsheet').hidden=true;pullNotifs()};$('#nsheet').onclick=e=>{if(e.target.id==='nsheet')$('#nsheet').hidden=true};
$('#nclear').onclick=async()=>{
  if(!confirm('مسح كل الإشعارات؟'))return;
  store.set('nchap',[]);NT.srv=NT.srv.filter(x=>x.kind==='broadcast');if(loggedIn())sbRpc('clear_notifications').catch(()=>{});updBadge();renderNotifs();

$('#nlist').onclick=async e=>{
  const it=e.target.closest('.nt');if(!it)return;

    updBadge();renderNotifs();return;
  }
  const n=src==='l'?chapNotifs().find(x=>x.id===id):NT.srv.find(x=>String(x.id)===id);
  if(n&&n.kind==='profile_like'&&n.actor_id){$('#nsheet').hidden=true;openProfile(n.actor_id);return}

  $('#nsheet').hidden=true;
  if(n.kind==='chapter')goChapter(n.slug,n.chapter);
  else{NT.openFor=n.slug;if(S.view==='detail'&&D.slug===n.slug&&D.data){NT.openFor=null;openComments()}else location.hash='#/s/'+enc(n.slug)}
};
setInterval(()=>{if(!document.hidden){pullNotifs();deviceCheck()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullNotifs()});
// ===== ضغط الصور المحمّلة + إدارة المساحة =====
let _skA=0;const _skW=[];
const skAcq=()=>new Promise(r=>{if(_skA<2){_skA++;r()}else _skW.push(r)});
const skRel=()=>{const n=_skW.shift();if(n)n();else _skA--};
async function shrink(d){
  if(typeof d!=='string'||!d.startsWith('data:image/'))return d;
  await skAcq();
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=d});
    const W=img.naturalWidth,H=img.naturalHeight;if(!W||!H)return d;
    let w=W,h2=H;if(W>1000){w=1000;h2=Math.round(H*1000/W)}
    if(h2>16000||w*h2>30e6)return d;
    const c=document.createElement('canvas');c.width=w;c.height=h2;c.getContext('2d').drawImage(img,0,0,w,h2);
    const o=c.toDataURL('image/webp',.78);
    c.width=c.height=0;
    return o.startsWith('data:image/webp')&&o.length<d.length*.9?o:d;
  }catch(e){return d}
  finally{skRel()}
}
// ضغط تلقائي هادئ للفصول المحمّلة سابقًا (فصل واحد في كل مرة، وبعيدًا عن وقت القراءة)
const dlc=(s,c)=>'dlc:'+s+':'+c;
let _ac=false;
async function autoCompress(){
  if(_ac)return;_ac=true;
  try{
    for(const it of dlList()){
      while(S.view==='reader'||document.hidden)await new Promise(r=>setTimeout(r,15000));
      if(localStorage.getItem(dlc(it.slug,it.ch)))continue;
      try{
        const arr=await dlGet(it.slug,it.ch);
        if(arr&&arr.length){
          const out=[];let changed=false;
          for(const d of arr){const n=await shrink(d);if(n!==d)changed=true;out.push(n)}
          if(changed)await dlSet(it.slug,it.ch,out);
        }
        localStorage.setItem(dlc(it.slug,it.ch),'1');
      }catch(e){}
      await new Promise(r=>setTimeout(r,400));
    }
  }finally{_ac=false}
}
setTimeout(autoCompress,25000);
$('#mC').onclick=async()=>{cache.clear();try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}toggleDrawer(false);toast('✅ تم مسح الذاكرة المؤقتة')};

addEventListener('offline',()=>{updOn();toast('📴 انقطع الاتصال')});
addEventListener('online',()=>{updOn();toast('عاد الاتصال');if(H.error&&S.mode==='home'){H.error=false;loadMore()}});updOn();
if(!navigator.onLine&&!location.hash.startsWith('#/s/'))$('#mD').click();else{resetGrid();loadMore()}
setTimeout(azCrawl,5*60000);setTimeout(dlResume,8000);

route();
